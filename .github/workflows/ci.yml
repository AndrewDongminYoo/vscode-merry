name: CI

on:
  workflow_dispatch: {}
  pull_request: { branches: [main] }
  push: { tags: [v*] }

permissions:
  checks: write
  contents: write

env:
  # Actions will be forced to run with Node.js 24 by default starting June 2nd, 2026.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          package="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$package" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $package"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run check-types

      - name: Lint
        run: pnpm run lint

      - name: Compile
        run: pnpm run compile

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      - name: Tests
        run: xvfb-run -a pnpm run test

      - name: Build VSIX
        run: pnpm dlx @vscode/vsce package --no-dependencies

      - name: Upload VSIX artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-merry-scripts-vsix
          path: "*.vsix"

      - name: Publish to VS Marketplace
        if: startsWith(github.ref, 'refs/tags/v') && env.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm dlx @vscode/vsce publish --no-dependencies --pat "$VSCE_PAT"
