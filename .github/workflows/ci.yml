name: CI

on:
  workflow_dispatch: {}
  pull_request: { branches: [main] }
  push: { tags: [v*] }

permissions:
  checks: write
  contents: write

env:
  # Actions will be forced to run with Node.js 24 by default starting June 2nd, 2026.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          package="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$package" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $package"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run check-types

      - name: Lint
        run: pnpm run lint

      - name: Compile
        run: pnpm run compile

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      - name: Tests
        run: xvfb-run -a pnpm run test

      - name: Build VSIX
        run: pnpm dlx @vscode/vsce package --no-dependencies

      - name: Upload VSIX artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vscode-merry-scripts-vsix
          path: "*.vsix"

      - name: Publish to VS Marketplace
        if: startsWith(github.ref, 'refs/tags/v') && env.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm dlx @vscode/vsce publish --no-dependencies --pat "$VSCE_PAT"
